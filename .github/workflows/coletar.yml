name: Coletar notícias de tênis

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest discover -s tests

      - name: Coletar
        run: python coletor/coletar.py noticias.json

      - name: Salvar se mudou
        run: |
          if git diff --quiet -- noticias.json; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "coleta: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
