<title>Tênis Notícias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: faixa azul de quadra dura no topo, barra de filtros fixa, uma coluna de notícias agrupada por dia */
:root {
  --quadra: #1d4f91;
  --quadra-escura: #173f75;
  --linha-quadra: #ffffff;
  --bola: #d7f04a;
  --bola-texto: #1f2a05;
  --fundo: #f3f5f8;
  --superficie: #ffffff;
  --texto: #142032;
  --texto-suave: #536175;
  --divisoria: #dbe2ea;
  --link: #1d4f91;
  --foco: #1d4f91;
  --aviso-fundo: #fff4cc;
  --aviso-texto: #4f3b00;
  --aviso-borda: #ecd06b;
  --cat-atp: #1d4f91;
  --cat-wta: #8b2c6b;
  --cat-br: #1b7a3c;
  --cat-slam: #8a5800;
  --cat-outros: #536175;
  --sobe: #1b7a3c;
  --desce: #b3261e;
  --fundo-br: #e9f6ee;
  --fonte-titulo: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --fonte-texto: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --quadra: #16396a;
    --quadra-escura: #102d55;
    --linha-quadra: #dfe9f7;
    --bola: #d7f04a;
    --bola-texto: #1f2a05;
    --fundo: #0c1520;
    --superficie: #132031;
    --texto: #e6ecf3;
    --texto-suave: #9cabbc;
    --divisoria: #22324a;
    --link: #8fbaff;
    --foco: #d7f04a;
    --aviso-fundo: #372e10;
    --aviso-texto: #f3dc8a;
    --aviso-borda: #6b5a1f;
    --cat-atp: #8fbaff;
    --cat-wta: #eb9fd0;
    --cat-br: #72d697;
    --cat-slam: #e9bb5e;
    --cat-outros: #9cabbc;
  --sobe: #72d697;
  --desce: #ff8f86;
  --fundo-br: #10291b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --quadra: #16396a;
  --quadra-escura: #102d55;
  --linha-quadra: #dfe9f7;
  --bola: #d7f04a;
  --bola-texto: #1f2a05;
  --fundo: #0c1520;
  --superficie: #132031;
  --texto: #e6ecf3;
  --texto-suave: #9cabbc;
  --divisoria: #22324a;
  --link: #8fbaff;
  --foco: #d7f04a;
  --aviso-fundo: #372e10;
  --aviso-texto: #f3dc8a;
  --aviso-borda: #6b5a1f;
  --cat-atp: #8fbaff;
  --cat-wta: #eb9fd0;
  --cat-br: #72d697;
  --cat-slam: #e9bb5e;
  --cat-outros: #9cabbc;
  --sobe: #72d697;
  --desce: #ff8f86;
  --fundo-br: #10291b;
  color-scheme: dark;
}

body {
  background: var(--fundo);
  color: var(--texto);
  font-family: var(--fonte-texto);
  font-size: 1rem;
  line-height: 1.55;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--fundo);
}
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 4px; }

.faixa-interna {
  max-width: 46rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Topo: a quadra */
.topo {
  background: var(--quadra);
  color: #ffffff;
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  position: relative;
  overflow: hidden;
}
.topo .faixa-interna {
  position: relative;
  padding-block: 1.75rem 1.5rem;
  display: grid;
  gap: 0.35rem;
}
.quadra-desenho {
  position: absolute;
  right: max(8px, env(safe-area-inset-right, 0px));
  top: 50%;
  transform: translateY(-50%);
  width: 13rem;
  max-width: 45%;
  height: auto;
  opacity: 0.28;
  pointer-events: none;
}
.quadra-desenho * { fill: none; stroke: var(--linha-quadra); stroke-width: 2; }
.topo h1 {
  margin: 0;
  font-family: var(--fonte-titulo);
  font-weight: 700;
  font-size: clamp(2rem, 7vw, 2.75rem);
  line-height: 1;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  text-wrap: balance;
  position: relative;
}
.status {
  margin: 0;
  font-size: 0.95rem;
  color: #ffffff;
  opacity: 0.88;
  position: relative;
  font-variant-numeric: tabular-nums;
}
.status strong { color: var(--bola); font-weight: 600; }

/* Abas: notícias e rankings */
.menu { position: relative; display: flex; flex-wrap: wrap; gap: 0.25rem 1.1rem; margin-top: 0.45rem; }
.aba {
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 0.2rem 0;
  color: #ffffff;
  font: 600 0.95rem/1.2 var(--fonte-texto);
  cursor: pointer;
}
.aba:hover { border-bottom-color: rgba(255, 255, 255, 0.55); }
.aba[aria-pressed="true"] { border-bottom-color: var(--bola); }

/* Filtros */
.filtros {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--fundo);
  border-bottom: 1px solid var(--divisoria);
}
.filtros .faixa-interna {
  display: flex;
  gap: 0.5rem;
  padding-block: 0.75rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.filtros .faixa-interna::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  border: 1px solid var(--divisoria);
  background: var(--superficie);
  color: var(--texto);
  font: 600 0.9rem/1 var(--fonte-texto);
  padding: 0.55rem 0.8rem;
  border-radius: 999px;
  cursor: pointer;
}
.chip:hover { border-color: var(--texto-suave); }
.chip[aria-pressed="true"] {
  background: var(--bola);
  border-color: var(--bola);
  color: var(--bola-texto);
}
.chip .conta {
  font-weight: 500;
  font-size: 0.8rem;
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
}

/* Conteúdo */
.conteudo .faixa-interna { padding-block: 1rem 2.5rem; display: grid; gap: 1.25rem; }
.aviso {
  background: var(--aviso-fundo);
  color: var(--aviso-texto);
  border: 1px solid var(--aviso-borda);
  border-radius: 10px;
  padding: 0.75rem 1rem;
  margin: 0;
  font-size: 0.95rem;
}
#avisos { display: grid; gap: 0.5rem; }
#avisos:empty { display: none; }

.dia { display: grid; gap: 0; }
.dia h2 {
  margin: 0 0 0.25rem;
  font-family: var(--fonte-titulo);
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--texto-suave);
}
.noticia {
  display: grid;
  gap: 0.35rem;
  padding-block: 1rem;
  border-top: 1px solid var(--divisoria);
  min-width: 0;
}
.meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 0.75rem;
  font-size: 0.82rem;
  color: var(--texto-suave);
  font-variant-numeric: tabular-nums;
}
.categoria {
  font-family: var(--fonte-titulo);
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}
.categoria::before {
  content: "";
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background: currentColor;
}
.cat-atp { color: var(--cat-atp); }
.cat-wta { color: var(--cat-wta); }
.cat-br { color: var(--cat-br); }
.cat-slam { color: var(--cat-slam); }
.cat-outros { color: var(--cat-outros); }
.noticia h3 {
  margin: 0;
  font-family: var(--fonte-titulo);
  font-weight: 600;
  font-size: 1.4rem;
  line-height: 1.15;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.resumo { margin: 0; max-width: 65ch; overflow-wrap: anywhere; }
.fontes {
  margin: 0.15rem 0 0;
  font-size: 0.88rem;
  color: var(--texto-suave);
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 0.6rem;
  align-items: baseline;
}
.fontes a { font-weight: 600; text-underline-offset: 2px; }
.traduzido {
  font-size: 0.78rem;
  border: 1px solid var(--divisoria);
  border-radius: 999px;
  padding: 0.05rem 0.5rem;
}

.mensagem {
  background: var(--superficie);
  border: 1px solid var(--divisoria);
  border-radius: 12px;
  padding: 1.5rem;
  display: grid;
  gap: 0.5rem;
}
.mensagem h2 { margin: 0; font-family: var(--fonte-titulo); font-size: 1.35rem; font-weight: 600; }
.mensagem p { margin: 0; color: var(--texto-suave); max-width: 60ch; }

/* Rankings */
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ranking-cabecalho { display: grid; gap: 0.35rem; }
.ranking-cabecalho h2 { margin: 0; font-family: var(--fonte-titulo); font-weight: 700; font-size: clamp(1.7rem, 5vw, 2.1rem); line-height: 1.1; }
.ranking-cabecalho p { margin: 0; }
.destaque-br { margin: 0; background: var(--fundo-br); border-left: 4px solid var(--cat-br); border-radius: 8px; padding: 0.7rem 0.9rem; font-weight: 600; }
.nota { margin: 0; font-size: 0.85rem; color: var(--texto-suave); }
.tabela { min-width: 0; }
.ranking {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--superficie);
  border: 1px solid var(--divisoria);
  border-radius: 12px;
  overflow: hidden;
  font-variant-numeric: tabular-nums;
}
.ranking th {
  font-family: var(--fonte-titulo);
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--texto-suave);
  text-align: left;
  padding: 0.6rem 0.65rem;
  border-bottom: 1px solid var(--divisoria);
}
.ranking td { padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--divisoria); vertical-align: middle; }
.ranking tbody tr:last-child td { border-bottom: 0; }
.ranking .num { text-align: right; white-space: nowrap; }
.ranking .pos { font-family: var(--fonte-titulo); font-weight: 700; font-size: 1.15rem; width: 2.75rem; }
.ranking .nome { display: block; font-weight: 600; overflow-wrap: anywhere; line-height: 1.25; }
.ranking .pais { display: block; font-size: 0.8rem; color: var(--texto-suave); }
.ranking tr.br td { background: var(--fundo-br); }
.ranking tr.br .pais { color: var(--cat-br); font-weight: 600; }
.var { font-weight: 600; font-size: 0.9rem; }
.sobe { color: var(--sobe); }
.desce { color: var(--desce); }
.igual { color: var(--texto-suave); }

.rodape {
  border-top: 1px solid var(--divisoria);
}
.rodape p {
  margin: 0;
  padding-block: 1.25rem 2rem;
  font-size: 0.85rem;
  color: var(--texto-suave);
  max-width: 65ch;
}

@media (prefers-reduced-motion: no-preference) {
  .chip { transition: background-color 0.15s ease, border-color 0.15s ease; }
}
</style>

<header class="topo">
  <div class="faixa-interna">
    <svg class="quadra-desenho" viewBox="0 0 240 110" aria-hidden="true" focusable="false">
      <rect x="4" y="4" width="232" height="102"></rect>
      <line x1="4" y1="17" x2="236" y2="17"></line>
      <line x1="4" y1="93" x2="236" y2="93"></line>
      <line x1="58" y1="17" x2="58" y2="93"></line>
      <line x1="182" y1="17" x2="182" y2="93"></line>
      <line x1="58" y1="55" x2="182" y2="55"></line>
      <line x1="120" y1="2" x2="120" y2="108" stroke-dasharray="3 3"></line>
    </svg>
    <h1>Tênis Notícias</h1>
    <p class="status" id="status">Carregando notícias…</p>
    <nav class="menu" aria-label="Seções da página">
      <button type="button" class="aba" data-vista="noticias" aria-pressed="true">Notícias</button>
      <button type="button" class="aba" data-vista="atp" aria-pressed="false">Ranking ATP</button>

    </nav>

</header>

<nav class="filtros" id="barra-filtros" aria-label="Filtrar por categoria">
  <div class="faixa-interna" id="filtros"></div>
</nav>

<main class="conteudo">
  <div class="faixa-interna">
    <div id="avisos"></div>
    <div id="lista" aria-live="polite"></div>
  </div>
</main>

<footer class="rodape">
  <div class="faixa-interna">
    <p>Resumos escritos pelo Claude a partir de portais de tênis do Brasil e do exterior, coletados a cada 30 minutos. Toque no nome do portal para ler a matéria original.</p>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var CATEGORIAS = ["ATP", "WTA", "Brasileiros", "Grand Slam", "Outros"];
  var CLASSE_CATEGORIA = { "ATP": "cat-atp", "WTA": "cat-wta", "Brasileiros": "cat-br", "Grand Slam": "cat-slam", "Outros": "cat-outros" };
  var IDIOMAS = { en: "inglês", fr: "francês", es: "espanhol", it: "italiano", de: "alemão" };
  var LIMITE_CLAUDE_MIN = 120;
  var LIMITE_ROBO_MIN = 180;
  var LIMITE_NOVIDADE_MIN = 360;
  var CHAVE_FILTRO = "noticias-tenis-filtro";
  var RANKINGS = {
    atp: { titulo: "Ranking ATP", genero: "masculino", coluna: "Jogador", brasileiros: "Brasileiros no top 100",
           nenhum: "Nenhum brasileiro está entre os 100 primeiros.", destaque: " Brasileiros em destaque." },
    wta: { titulo: "Ranking WTA", genero: "feminino", coluna: "Jogadora", brasileiros: "Brasileiras no top 100",
           nenhum: "Nenhuma brasileira está entre as 100 primeiras.", destaque: " Brasileiras em destaque." }
  };

  var noticias = [];
  var estado = null;
  var filtro = lerFiltro();
  var situacao = "carregando"; // carregando | pronto | lento | erro | indisponivel | semLogin
  var souDono = false; // avisos sobre o robô e o app do Claude só interessam ao dono
  var vista = "noticias"; // noticias | atp | wta
  var rankings = { atp: null, wta: null };

  var elStatus = document.getElementById("status");
  var elFiltros = document.getElementById("filtros");
  var elAvisos = document.getElementById("avisos");
  var elLista = document.getElementById("lista");
  var elBarraFiltros = document.getElementById("barra-filtros");
  var abas = document.querySelectorAll(".aba");

  function lerFiltro() {
    try {
      var salvo = localStorage.getItem(CHAVE_FILTRO);
      return salvo && (salvo === "Todas" || CATEGORIAS.indexOf(salvo) >= 0) ? salvo : "Todas";
    } catch (e) {
      return "Todas";
    }
  }

  function salvarFiltro(valor) {
    try { localStorage.setItem(CHAVE_FILTRO, valor); } catch (e) { /* sem armazenamento: tudo bem */ }
  }

  function criar(tag, classe, texto) {
    var el = document.createElement(tag);
    if (classe) el.className = classe;
    if (texto !== undefined && texto !== null) el.textContent = String(texto);
    return el;
  }

  function texto(valor) {
    return typeof valor === "string" ? valor : "";
  }

  function paraData(iso) {
    var d = new Date(texto(iso));
    return isNaN(d.getTime()) ? null : d;
  }

  function minutosDesde(iso) {
    var d = paraData(iso);
    return d ? Math.max(0, Math.floor((Date.now() - d.getTime()) / 60000)) : null;
  }

  var formatoDataHora = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  var formatoDia = new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "long" });

  function tempoRelativo(iso) {
    var minutos = minutosDesde(iso);
    if (minutos === null) return "";
    if (minutos < 1) return "agora";
    if (minutos < 60) return "há " + minutos + " min";
    var horas = Math.floor(minutos / 60);
    if (horas < 24) return "há " + horas + " h";
    return formatoDataHora.format(paraData(iso)).replace(",", " às");
  }

  function duracao(minutos) {
    if (minutos < 60) return minutos + " min";
    var horas = Math.floor(minutos / 60);
    return horas === 1 ? "1 hora" : horas + " horas";
  }

  function chaveDia(data) {
    return data.getFullYear() + "-" + (data.getMonth() + 1) + "-" + data.getDate();
  }

  function rotuloDia(data) {
    var hoje = new Date();
    var ontem = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - 1);
    if (chaveDia(data) === chaveDia(hoje)) return "Hoje";
    if (chaveDia(data) === chaveDia(ontem)) return "Ontem";
    return formatoDia.format(data);
  }

  function linkSeguro(url) {
    return typeof url === "string" && url.indexOf("https://") === 0 ? url : null;
  }

  function normalizarNoticia(doc) {
    var dados = doc.data() || {};
    var categoria = CATEGORIAS.indexOf(dados.categoria) >= 0 ? dados.categoria : "Outros";
    var fontes = Array.isArray(dados.fontes) ? dados.fontes.filter(function (f) { return f && typeof f.nome === "string"; }) : [];
    return {
      id: doc.id,
      titulo: texto(dados.titulo),
      resumo: texto(dados.resumo),
      categoria: categoria,
      fontes: fontes,
      publicadoEm: texto(dados.publicadoEm)
    };
  }

  function renderStatus() {
    elStatus.textContent = "";
    if (situacao === "indisponivel") {
      elStatus.textContent = "Abra esta página no claude.ai para ver as notícias.";
      return;
    }
    if (situacao === "semLogin") {
      elStatus.textContent = "Entre na sua conta do Claude para ver as notícias.";
      return;
    }
    if (estado && paraData(estado.atualizadoEm)) {
      elStatus.appendChild(document.createTextNode("Atualizado " + tempoRelativo(estado.atualizadoEm)));
      var novas = typeof estado.novasNaRodada === "number" ? estado.novasNaRodada : 0;
      if (novas > 0) {
        elStatus.appendChild(document.createTextNode(" · "));
        elStatus.appendChild(criar("strong", null, novas === 1 ? "1 nova" : novas + " novas"));
        elStatus.appendChild(document.createTextNode(" na última rodada"));
      }
      return;
    }
    elStatus.textContent = situacao === "carregando" ? "Carregando notícias…" : "Aguardando a primeira rodada do Claude";
  }

  function renderAvisos() {
    elAvisos.textContent = "";
    if (situacao === "lento") {
      elAvisos.appendChild(criar("p", "aviso", "As notícias estão demorando para carregar. Confira sua conexão; a página tenta de novo sozinha."));
    }
    if (situacao === "erro") {
      elAvisos.appendChild(criar("p", "aviso", "Não foi possível carregar as notícias agora. Recarregue a página daqui a pouco."));
    }
    if (!estado || !souDono) return;
    var semClaude = minutosDesde(estado.atualizadoEm);
    if (semClaude !== null && semClaude > LIMITE_CLAUDE_MIN) {
      elAvisos.appendChild(criar("p", "aviso", "O Claude não atualiza as notícias há " + duracao(semClaude) +
        ". Elas voltam a chegar quando o app do Claude estiver aberto no PC."));
    }
    var semRobo = minutosDesde(estado.coletaEm);
    if (semRobo !== null && semRobo > LIMITE_ROBO_MIN) {
      elAvisos.appendChild(criar("p", "aviso", "O robô que coleta as notícias no GitHub está parado há " + duracao(semRobo) + "."));
      return;
    }
    var total = typeof estado.totalFontes === "number" ? estado.totalFontes : 0;
    var falhas = Array.isArray(estado.fontesComFalha) ? estado.fontesComFalha.length : 0;
    if (total > 0 && falhas * 2 >= total) {
      elAvisos.appendChild(criar("p", "aviso", falhas + " de " + total + " fontes falharam na última coleta do robô."));
    }
    var semNovidade = minutosDesde(estado.novidadeEm);
    if (semNovidade !== null && semNovidade > LIMITE_NOVIDADE_MIN) {
      elAvisos.appendChild(criar("p", "aviso", "O robô não traz notícias novas há " + duracao(semNovidade) + "."));
    }
  }

  function renderFiltros() {
    var contagem = { "Todas": noticias.length };
    CATEGORIAS.forEach(function (c) { contagem[c] = 0; });
    noticias.forEach(function (n) { contagem[n.categoria] += 1; });
    elFiltros.textContent = "";
    ["Todas"].concat(CATEGORIAS).forEach(function (nome) {
      var botao = criar("button", "chip");
      botao.type = "button";
      botao.id = "filtro-" + nome.toLowerCase().replace(/\s+/g, "-");
      botao.setAttribute("aria-pressed", String(filtro === nome));
      botao.appendChild(criar("span", null, nome));
      botao.appendChild(criar("span", "conta", contagem[nome]));
      botao.addEventListener("click", function () {
        filtro = nome;
        salvarFiltro(nome);
        render();
      });
      elFiltros.appendChild(botao);
    });
  }

  function cartao(n) {
    var artigo = criar("article", "noticia");
    var meta = criar("div", "meta");
    meta.appendChild(criar("span", "categoria " + CLASSE_CATEGORIA[n.categoria], n.categoria));
    var data = paraData(n.publicadoEm);
    if (data) {
      var tempo = criar("time", null, tempoRelativo(n.publicadoEm));
      tempo.dateTime = n.publicadoEm;
      meta.appendChild(tempo);
    }
    artigo.appendChild(meta);
    artigo.appendChild(criar("h3", null, n.titulo));
    if (n.resumo) artigo.appendChild(criar("p", "resumo", n.resumo));

    if (n.fontes.length) {
      var fontes = criar("p", "fontes");
      fontes.appendChild(criar("span", null, n.fontes.length === 1 ? "Fonte:" : "Fontes:"));
      var idiomas = {};
      n.fontes.forEach(function (f) {
        var url = linkSeguro(f.link);
        if (url) {
          var a = criar("a", null, f.nome);
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          fontes.appendChild(a);
        } else {
          fontes.appendChild(criar("span", null, f.nome));
        }
        if (IDIOMAS[f.idioma]) idiomas[IDIOMAS[f.idioma]] = true;
      });
      var traduzidos = Object.keys(idiomas);
      if (traduzidos.length) {
        fontes.appendChild(criar("span", "traduzido", "traduzido do " + traduzidos.join(" e do ")));
      }
      artigo.appendChild(fontes);
    }
    return artigo;
  }

  function renderMenu() {
    Array.prototype.forEach.call(abas, function (aba) {
      aba.setAttribute("aria-pressed", String(aba.getAttribute("data-vista") === vista));
    });
    elBarraFiltros.hidden = vista !== "noticias";
  }

  function formatarPontos(valor) {
    return Math.round(Number(valor) || 0).toLocaleString("pt-BR");
  }

  function variacao(jogador) {
    var anterior = Number(jogador.anterior);
    var posicao = Number(jogador.posicao);
    var marca = criar("span", "var igual", "–");
    if (!anterior || !isFinite(anterior)) {
      marca.title = "Sem dado anterior";
      return marca;
    }
    var diferenca = anterior - posicao;
    if (diferenca === 0) {
      marca.title = "Manteve a posição";
      marca.appendChild(criar("span", "sr", " Manteve a posição"));
      return marca;
    }
    var passos = Math.abs(diferenca);
    var frase = (diferenca > 0 ? "Subiu " : "Caiu ") + passos + (passos === 1 ? " posição" : " posições");
    marca.className = "var " + (diferenca > 0 ? "sobe" : "desce");
    marca.title = frase;
    marca.textContent = "";
    var seta = criar("span", null, diferenca > 0 ? "▲" : "▼");
    seta.setAttribute("aria-hidden", "true");
    marca.appendChild(seta);
    marca.appendChild(document.createTextNode(" " + passos));
    marca.appendChild(criar("span", "sr", " " + frase));
    return marca;
  }

  function renderRanking(qual) {
    var info = RANKINGS[qual];
    var dados = rankings[qual];
    var jogadores = dados && Array.isArray(dados.jogadores) ? dados.jogadores.filter(function (j) {
      return j && typeof j.nome === "string" && isFinite(Number(j.posicao));
    }) : [];
    var cabecalho = criar("div", "ranking-cabecalho");
    cabecalho.appendChild(criar("h2", null, info.titulo));
    cabecalho.appendChild(criar("p", null, "O top 100 do ranking de simples " + info.genero + "."));
    elLista.appendChild(cabecalho);
    if (!jogadores.length) {
      if (situacao === "carregando") return;
      elLista.appendChild(mensagem("O ranking ainda não chegou",
        "Ele aparece aqui depois da próxima rodada do Claude. As rodadas acontecem a cada 30 minutos, com o app do Claude aberto no PC."));
      return;
    }
    var brasileiros = jogadores.filter(function (j) { return j.br === true; });
    if (brasileiros.length) {
      var nomes = brasileiros.map(function (j) { return j.nome + " (" + Number(j.posicao) + "º)"; });
      var lista = nomes.length === 1 ? nomes[0] : nomes.slice(0, -1).join(", ") + " e " + nomes[nomes.length - 1];
      elLista.appendChild(criar("p", "destaque-br", info.brasileiros + ": " + lista + "."));
    } else {
      elLista.appendChild(criar("p", "nota", info.nenhum));
    }
    var tabela = criar("table", "ranking");
    tabela.appendChild(criar("caption", "sr", info.titulo + " de simples"));
    var cabecalhoTabela = criar("thead");
    var linhaTitulos = criar("tr");
    [["Pos.", null], [info.coluna, null], ["Pontos", "num"], ["Variação", "num"]].forEach(function (coluna) {
      var th = criar("th", coluna[1], coluna[0]);
      th.scope = "col";
      linhaTitulos.appendChild(th);
    });
    cabecalhoTabela.appendChild(linhaTitulos);
    tabela.appendChild(cabecalhoTabela);
    var corpo = criar("tbody");
    jogadores.forEach(function (j) {
      var linha = criar("tr", j.br === true ? "br" : null);
      linha.appendChild(criar("td", "pos", Number(j.posicao)));
      var celula = criar("td");
      celula.appendChild(criar("span", "nome", j.nome));
      celula.appendChild(criar("span", "pais", texto(j.pais)));
      linha.appendChild(celula);
      linha.appendChild(criar("td", "num", formatarPontos(j.pontos)));
      var celulaVariacao = criar("td", "num");
      celulaVariacao.appendChild(variacao(j));
      linha.appendChild(celulaVariacao);
      corpo.appendChild(linha);
    });
    tabela.appendChild(corpo);
    var caixa = criar("div", "tabela");
    caixa.appendChild(tabela);
    elLista.appendChild(caixa);
    var data = paraData(dados.atualizadoEm);
    var quando = data ? data.toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" }) : "";
    elLista.appendChild(criar("p", "nota", (quando ? "Dados de " + quando + ", da " : "Dados da ") +
      (texto(dados.fonte) || "ESPN") + ". A variação compara com o ranking anterior." +
      (brasileiros.length ? info.destaque : "")));
  }

  function mensagem(titulo, corpo) {
    var caixa = criar("div", "mensagem");
    caixa.appendChild(criar("h2", null, titulo));
    caixa.appendChild(criar("p", null, corpo));
    return caixa;
  }

  function renderLista() {
    elLista.textContent = "";
    if (situacao === "indisponivel") {
      elLista.appendChild(mensagem("Página fora do claude.ai", "As notícias ficam guardadas no claude.ai. Abra o link da página lá para vê-las."));
      return;
    }
    if (situacao === "semLogin") {
      elLista.appendChild(mensagem("Entre para ver as notícias",
        "As notícias desta página ficam guardadas no Claude e só aparecem para quem está conectado. Entre na sua conta do Claude e abra este link de novo."));
      return;
    }
    if (vista !== "noticias") {
      renderRanking(vista);
      return;
    }
    if (!noticias.length) {
      if (situacao === "carregando") return;
      elLista.appendChild(mensagem("Ainda não há notícias",
        "O Claude publica as primeiras na próxima rodada. As rodadas acontecem a cada 30 minutos, com o app do Claude aberto no PC."));
      return;
    }
    var visiveis = filtro === "Todas" ? noticias : noticias.filter(function (n) { return n.categoria === filtro; });
    if (!visiveis.length) {
      elLista.appendChild(mensagem("Nada em " + filtro + " por enquanto", "Não há notícias desta categoria nos últimos 7 dias. Escolha outra categoria acima."));
      return;
    }
    var grupoAtual = null;
    var chaveAtual = null;
    visiveis.forEach(function (n) {
      var data = paraData(n.publicadoEm) || new Date();
      var chave = chaveDia(data);
      if (chave !== chaveAtual) {
        chaveAtual = chave;
        grupoAtual = criar("section", "dia");
        grupoAtual.appendChild(criar("h2", null, rotuloDia(data)));
        elLista.appendChild(grupoAtual);
      }
      grupoAtual.appendChild(cartao(n));
    });
  }

  function render() {
    renderStatus();
    renderAvisos();
    renderMenu();
    renderFiltros();
    renderLista();
  }

  Array.prototype.forEach.call(abas, function (aba) {
    aba.addEventListener("click", function () {
      vista = aba.getAttribute("data-vista");
      render();
    });
  });

  render();
  // a cada minuto só os horários mudam; os filtros ficam como estão para não perder o foco
  setInterval(function () {
    renderStatus();
    renderAvisos();
    if (vista === "noticias") renderLista();
  }, 60000);

  function iniciar(db) {
    var timer = setTimeout(function () {
      if (situacao === "carregando") { situacao = "lento"; render(); }
    }, 10000);

    function confirmado(snap) {
      if (snap.metadata && !snap.metadata.fromCache) {
        clearTimeout(timer);
        if (situacao === "carregando" || situacao === "lento") situacao = "pronto";
      }
    }

    function falhou() {
      clearTimeout(timer);
      situacao = "erro";
      render();
    }

    db.collection("noticias").orderBy("publicadoEm", "desc").limit(1000).onSnapshot(function (snap) {
      noticias = snap.docs.filter(function (d) { return d.exists; }).map(normalizarNoticia)
        .filter(function (n) { return n.titulo; });
      confirmado(snap);
      render();
    }, falhou);

    Object.keys(RANKINGS).forEach(function (qual) {
      db.doc("meta/ranking-" + qual).onSnapshot(function (snap) {
        rankings[qual] = snap.exists ? (snap.data() || null) : null;
        if (vista === qual) renderLista();
      }, function () {
        rankings[qual] = null;
        if (vista === qual) renderLista();
      });
    });

    db.doc("meta/estado").onSnapshot(function (snap) {
      estado = snap.exists ? (snap.data() || null) : null;
      confirmado(snap);
      render();
    }, falhou);
  }

  if (!window.claude || typeof window.claude.use !== "function") {
    situacao = "indisponivel";
    render();
    return;
  }
  window.claude.use("user").then(function (usuario) {
    if (!usuario) return;
    usuario.isOwner().then(function (dono) {
      souDono = dono === true;
      renderAvisos();
    }, function () { /* sem resposta: trata como visitante */ });
  }, function () { /* sem resposta: trata como visitante */ });

  window.claude.use("db").then(function (db) {
    if (!db) {
      situacao = "semLogin";
      render();
      return;
    }
    iniciar(db);
  }, function () {
    situacao = "semLogin";
    render();
  });
})();
</script>
